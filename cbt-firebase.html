<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Exam System</title>
<style>
/* ============================= RESET ============================= */
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height:100vh;
  color:#222;
}
a { text-decoration:none; color:inherit; }
button { cursor:pointer; font-family:inherit; border:none; }

/* ============================= ANIMATIONS ============================= */
@keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes slideIn { from{opacity:0; transform:translateX(-20px);} to{opacity:1; transform:translateX(0);} }
@keyframes bounce { 0%,20%,50%,80%,100%{transform:translateY(0);} 40%{transform:translateY(-12px);} 60%{transform:translateY(-6px);} }
@keyframes pulse { 0%{ box-shadow:0 0 0 0 rgba(220,53,69,.6);} 70%{ box-shadow:0 0 0 12px rgba(220,53,69,0);} 100%{ box-shadow:0 0 0 0 rgba(220,53,69,0);} }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes glow { 0%,100%{ box-shadow:0 4px 14px rgba(102,126,234,.25);} 50%{ box-shadow:0 8px 26px rgba(118,75,162,.5);} }

.fade-in { animation: fadeIn .5s ease both; }
.slide-in { animation: slideIn .45s ease both; }
.bounce { animation: bounce 2s infinite; display:inline-block; }

/* ============================= NAVBAR ============================= */
nav {
  position:sticky; top:0; z-index:100;
  background:rgba(255,255,255,.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding:14px 24px;
  display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:10px;
  box-shadow:0 2px 12px rgba(0,0,0,.1);
}
.brand { font-size:1.4rem; font-weight:800; color:#fff; letter-spacing:.5px; }
.brand span { display:inline-block; }
.nav-links { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.nav-links button, .nav-links a.navbtn {
  background:rgba(255,255,255,.2); color:#fff; padding:8px 16px;
  border-radius:24px; font-weight:600; font-size:.9rem;
  transition:all .25s ease;
}
.nav-links button:hover, .nav-links a.navbtn:hover { background:#fff; color:#764ba2; transform:translateY(-2px); }
.nav-tag { background:rgba(255,255,255,.25); color:#fff; padding:6px 14px; border-radius:20px; font-size:.85rem; font-weight:600; }

/* ============================= CONTAINERS ============================= */
.container { max-width:1100px; margin:0 auto; padding:30px 20px 60px; }
.card {
  background:#fff; border-radius:16px; padding:30px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  margin-bottom:24px;
}
.card h2 { margin-bottom:14px; color:#4b3384; }
.card h3 { margin-bottom:10px; color:#4b3384; }

/* ============================= HERO ============================= */
.hero { text-align:center; color:#fff; padding:70px 20px 40px; }
.hero h1 { font-size:2.6rem; margin-bottom:14px; }
.hero p { font-size:1.1rem; opacity:.9; margin-bottom:26px; }
.hero-buttons { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }

.features-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:40px; }
.feature-card {
  background:#fff; border-radius:16px; padding:26px; text-align:center;
  box-shadow:0 10px 26px rgba(0,0,0,.15); transition:transform .3s ease;
}
.feature-card:hover { transform:translateY(-8px); animation:glow 1.6s infinite; }
.feature-card .icon { font-size:2.4rem; margin-bottom:10px; }
.feature-card h3 { color:#4b3384; margin-bottom:8px; }
.feature-card p { color:#555; font-size:.92rem; }

/* ============================= BUTTONS ============================= */
.btn {
  display:inline-block; padding:11px 26px; border-radius:10px; font-weight:700;
  font-size:.95rem; transition:all .25s ease; border:none;
}
.btn-primary { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(102,126,234,.5); }
.btn-outline { background:#fff; color:#667eea; border:2px solid #fff; }
.btn-outline:hover { transform:translateY(-2px); }
.btn-success { background:linear-gradient(135deg,#2ecc71,#27ae60); color:#fff; }
.btn-success:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(46,204,113,.5); }
.btn-danger { background:linear-gradient(135deg,#eb4d4b,#c0392b); color:#fff; }
.btn-danger:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(235,77,75,.5); }
.btn-word { background:linear-gradient(135deg,#2b579a,#1e3f6f); color:#fff; }
.btn-word:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(43,87,154,.5); }
.btn-sm { padding:7px 14px; font-size:.82rem; border-radius:8px; }
.btn-block { width:100%; }
.btn:disabled { opacity:.55; cursor:not-allowed; transform:none !important; box-shadow:none !important; }

/* ============================= FORMS ============================= */
.form-group { margin-bottom:16px; }
label { display:block; font-weight:600; margin-bottom:6px; color:#444; font-size:.9rem; }
input, select, textarea {
  width:100%; padding:11px 14px; border:2px solid #e2e2f5; border-radius:10px;
  font-size:.95rem; transition:border-color .2s ease; background:#fafaff;
}
input:focus, select:focus, textarea:focus { outline:none; border-color:#764ba2; }
.form-narrow { max-width:440px; margin:0 auto; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:600px){ .grid-2{ grid-template-columns:1fr; } .features-grid{ grid-template-columns:1fr; } }

/* ============================= TABLES ============================= */
table { width:100%; border-collapse:collapse; margin-top:10px; }
th, td { padding:12px 14px; text-align:left; border-bottom:1px solid #eee; font-size:.9rem; }
th { background:#f4f2fc; color:#4b3384; font-weight:700; }
tr { transition:background .2s ease; }
tbody tr:hover { background:#faf9ff; }
.table-wrap { overflow-x:auto; }
.badge { padding:4px 10px; border-radius:20px; font-size:.75rem; font-weight:700; }
.badge-pass { background:#d4f7dc; color:#1a7a3c; }
.badge-fail { background:#fbdada; color:#a32323; }
.badge-role { background:#e6e0fb; color:#4b3384; text-transform:capitalize; }

/* ============================= STATS ============================= */
.stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:26px; }
.stat-card {
  background:#fff; border-radius:16px; padding:24px; text-align:center;
  box-shadow:0 8px 22px rgba(0,0,0,.12); transition:transform .3s ease;
}
.stat-card:hover { transform:translateY(-6px); animation:glow 1.6s infinite; }
.stat-card .num { font-size:2.2rem; font-weight:800; color:#764ba2; }
.stat-card .label { color:#666; font-size:.9rem; margin-top:4px; }
@media (max-width:700px){ .stats-grid{ grid-template-columns:1fr; } }

/* ============================= TABS ============================= */
.tabs { display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap; }
.tab-btn {
  background:#f0eefc; color:#4b3384; padding:10px 20px; border-radius:10px;
  font-weight:700; font-size:.9rem; transition:all .2s ease;
}
.tab-btn.active { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; }

/* ============================= EXAM PAGE ============================= */
.exam-header {
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
  background:#fff; border-radius:16px; padding:20px 26px; margin-bottom:22px;
  box-shadow:0 8px 22px rgba(0,0,0,.12); position:sticky; top:78px; z-index:50;
}
.timer {
  background:#dc3545; color:#fff; padding:10px 22px; border-radius:30px;
  font-weight:800; font-size:1.2rem; animation:pulse 1.6s infinite;
}
.q-box {
  background:#fff; border-radius:14px; padding:22px; margin-bottom:18px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}
.q-box .q-title { font-weight:700; margin-bottom:14px; color:#333; }
.option-row {
  display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px;
  border:2px solid #eee; margin-bottom:8px; cursor:pointer; transition:all .2s ease;
}
.option-row:hover { border-color:#c9c0f2; background:#faf9ff; }
.option-row.selected { border-color:#764ba2; background:#f0eefc; }
.option-row input { width:auto; }

/* ============================= LOADER ============================= */
.loader-overlay {
  position:fixed; inset:0; background:rgba(102,126,234,.25); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; z-index:999;
}
.spinner {
  width:54px; height:54px; border:6px solid #fff; border-top-color:#764ba2;
  border-radius:50%; animation:spin .8s linear infinite;
}
.hidden { display:none !important; }

/* ============================= ALERTS ============================= */
#alertBox { position:fixed; top:20px; right:20px; z-index:1000; display:flex; flex-direction:column; gap:10px; }
.alert {
  padding:14px 20px; border-radius:10px; color:#fff; font-weight:600; min-width:240px;
  box-shadow:0 8px 22px rgba(0,0,0,.2); animation:slideIn .3s ease both;
}
.alert-success { background:#27ae60; }
.alert-error { background:#c0392b; }
.alert-info { background:#2980b9; }

.muted { color:#777; font-size:.88rem; }
.center { text-align:center; }
.mt10{margin-top:10px;} .mt20{margin-top:20px;} .mb10{margin-bottom:10px;}
footer { text-align:center; color:#fff; opacity:.85; padding:26px; font-size:.85rem; }
</style>
</head>
<body>

<nav>
  <div class="brand"><span class="bounce">📝</span> CBT Exam System</div>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div id="app"></div>

<footer>CBT Exam System &middot; Powered by Firebase</footer>

<div id="alertBox"></div>
<div id="loaderOverlay" class="loader-overlay hidden"><div class="spinner"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script type="module">
/* =========================================================================
   SECTION 1: FIREBASE IMPORTS (CDN, modular SDK v10.7.0)
========================================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signInAnonymously, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc,
  updateDoc, deleteDoc, query, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

/* =========================================================================
   SECTION 2: FIREBASE CONFIG
========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyA8d2AAafTQt5-cXeVmlFpLVu1_5xvrkmo",
  authDomain: "exam-office.firebaseapp.com",
  projectId: "exam-office",
  storageBucket: "exam-office.firebasestorage.app",
  messagingSenderId: "148163576058",
  appId: "1:148163576058:web:5b5b5591aef78467c6c943"
};

/* =========================================================================
   SECTION 3: INITIALIZE FIREBASE
========================================================================= */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Classes students choose from when starting an exam (Primary 4 – SS 3)
const CLASS_LIST = ['Primary 4','Primary 5','Primary 6','JSS 1','JSS 2','JSS 3','SS 1','SS 2','SS 3'];

/* =========================================================================
   SECTION 4: GLOBAL STATE
========================================================================= */
let currentUser = null;      // { id, name, email, role } — teachers/admins only
let currentPage = 'home';
let pageParams = {};
let activeTab = {};
let selectedAnswers = {};
let examTimerInterval = null;
let authReady = false;

/* =========================================================================
   SECTION 5: HELPER FUNCTIONS (alerts, loader, navigation)
========================================================================= */
function showAlert(message, type='info'){
  const box = document.getElementById('alertBox');
  const div = document.createElement('div');
  div.className = 'alert alert-' + type;
  div.textContent = message;
  box.appendChild(div);
  setTimeout(() => div.remove(), 4000);
}
function showLoader(){ document.getElementById('loaderOverlay').classList.remove('hidden'); }
function hideLoader(){ document.getElementById('loaderOverlay').classList.add('hidden'); }

function navigateTo(page, params={}){
  currentPage = page;
  pageParams = params;
  window.scrollTo(0,0);
  render();
}
function switchTab(dashboard, tab){
  activeTab[dashboard] = tab;
  render();
}
Object.assign(window, { navigateTo, switchTab });

// Students never see a login step. To still require *some* authenticated
// session for Firestore writes (so exam results can't be spammed by bare
// HTTP requests with no session at all), every guest is silently signed in
// anonymously the first time they need to read/write exam data. This is
// invisible to the user — no form, no password — and never overrides a real
// teacher/admin session (it only fires when nobody is signed in at all).
// Requires Anonymous sign-in to be enabled in Firebase Authentication.
async function ensureAnonAuth(){
  if (!auth.currentUser) {
    try { await signInAnonymously(auth); } catch (e) { console.error('Anonymous sign-in failed', e); }
  }
}

/* =========================================================================
   SECTION 6: AUTH FUNCTIONS (teachers & admin only)
========================================================================= */
async function registerTeacher(name, email, password){
  if (!name || !email || !password) { showAlert('Please fill in all required fields.', 'error'); return; }
  showLoader();
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db, 'users', cred.user.uid), {
      name, email, role: 'teacher', createdAt: serverTimestamp()
    });
    await signOut(auth);
    showAlert('Registration successful! Please log in.', 'success');
    navigateTo('login');
  } catch (err) {
    showAlert(friendlyAuthError(err), 'error');
  } finally { hideLoader(); }
}

async function loginUser(email, password){
  if (!email || !password) { showAlert('Please enter email and password.', 'error'); return; }
  showLoader();
  try {
    await signInWithEmailAndPassword(auth, email, password);
    // onAuthStateChanged handles loading profile + navigation
  } catch (err) {
    showAlert(friendlyAuthError(err), 'error');
    hideLoader();
  }
}

async function logout(){
  await signOut(auth);
  currentUser = null;
  showAlert('You have been logged out.', 'info');
  navigateTo('home');
}

function friendlyAuthError(err){
  const code = err.code || '';
  if (code.includes('email-already-in-use')) return 'An account with this email already exists.';
  if (code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'Invalid email or password.';
  if (code.includes('weak-password')) return 'Password should be at least 6 characters.';
  if (code.includes('invalid-email')) return 'Please enter a valid email address.';
  if (code.includes('admin-restricted-operation')) return 'Anonymous sign-in is not enabled for this Firebase project yet — see the setup guide.';
  return 'Something went wrong: ' + (err.message || code);
}

// One-tap creation of the default admin account. Always available on the
// login page. If admin@cbt.com already exists, Firebase simply rejects the
// creation attempt and we show a friendly message instead of erroring.
async function setupDefaultAdmin(){
  showLoader();
  try {
    const cred = await createUserWithEmailAndPassword(auth, 'admin@cbt.com', 'admin123');
    await setDoc(doc(db, 'users', cred.user.uid), {
      name: 'System Admin', email: 'admin@cbt.com', role: 'admin', createdAt: serverTimestamp()
    });
    await signOut(auth);
    showAlert('Admin account created! Login with admin@cbt.com / admin123', 'success');
    navigateTo('login');
  } catch (err) {
    if ((err.code||'').includes('email-already-in-use')) {
      showAlert('An admin account already exists — just log in below with admin@cbt.com.', 'info');
    } else {
      showAlert('Could not create admin: ' + err.message, 'error');
    }
  } finally { hideLoader(); }
}

// Auto-login on page refresh for teachers/admins. Anonymous sessions (used
// for guest exam-takers) are deliberately ignored here — they never become
// an app "currentUser".
onAuthStateChanged(auth, async (user) => {
  authReady = true;
  if (user && !user.isAnonymous) {
    showLoader();
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (snap.exists()) {
        currentUser = { id: user.uid, ...snap.data() };
        if (currentPage === 'home' || currentPage === 'login' || currentPage === 'register') {
          currentPage = currentUser.role === 'admin' ? 'admin' : 'teacher';
        }
      } else {
        currentUser = null;
      }
    } catch (e) {
      showAlert('Could not load your profile: ' + e.message, 'error');
    } finally {
      hideLoader();
      render();
    }
  } else {
    currentUser = null;
    render();
  }
});

/* =========================================================================
   SECTION 7: DATABASE FUNCTIONS (Firestore CRUD)
========================================================================= */
async function fetchCollection(name, filters=[]){
  let q = collection(db, name);
  if (filters.length) q = query(collection(db, name), ...filters.map(f => where(f[0], f[1], f[2])));
  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id:d.id, ...d.data() }));
}

async function createExam(title, subject, duration, passMark){
  if (!title || !subject || !duration || !passMark) { showAlert('Please fill in all exam fields.', 'error'); return; }
  showLoader();
  try {
    const ref = await addDoc(collection(db, 'exams'), {
      title, subject, duration:Number(duration), passMark:Number(passMark),
      totalMarks:0, teacherId:currentUser.id, teacherName:currentUser.name,
      status:'published', createdAt: serverTimestamp()
    });
    showAlert('Exam created! Now add some questions.', 'success');
    navigateTo('questions', { examId: ref.id });
  } catch (err) { showAlert('Error creating exam: ' + err.message, 'error'); }
  finally { hideLoader(); }
}

async function deleteExam(examId){
  if (!confirm('Delete this exam and all its questions/results? This cannot be undone.')) return;
  showLoader();
  try {
    // Delete children first (questions, attempts) while the exam doc still
    // exists — the attempts delete rule looks up the exam's teacherId, so
    // deleting the exam itself first would break that lookup.
    const qs = await fetchCollection('questions', [['examId','==',examId]]);
    for (const q of qs) await deleteDoc(doc(db, 'questions', q.id));
    const as = await fetchCollection('attempts', [['examId','==',examId]]);
    for (const a of as) await deleteDoc(doc(db, 'attempts', a.id));
    await deleteDoc(doc(db, 'exams', examId));
    showAlert('Exam deleted.', 'success');
    navigateTo(currentUser.role === 'admin' ? 'admin' : 'teacher');
  } catch (err) { showAlert('Error deleting exam: ' + err.message, 'error'); }
  finally { hideLoader(); }
}

async function addQuestion(examId, text, marks, options, correctIndex){
  if (!text || options.some(o => !o) || correctIndex === null) { showAlert('Please complete the question, all 4 options, and mark the correct answer.', 'error'); return; }
  showLoader();
  try {
    await addDoc(collection(db, 'questions'), { examId, text, marks:Number(marks)||1, options, correctIndex:Number(correctIndex) });
    const qs = await fetchCollection('questions', [['examId','==',examId]]);
    const totalMarks = qs.reduce((s,q)=>s+q.marks,0);
    await updateDoc(doc(db, 'exams', examId), { totalMarks });
    showAlert('Question added.', 'success');
    render();
  } catch (err) { showAlert('Error adding question: ' + err.message, 'error'); }
  finally { hideLoader(); }
}

async function deleteQuestion(qId, examId){
  if (!confirm('Delete this question?')) return;
  showLoader();
  try {
    await deleteDoc(doc(db, 'questions', qId));
    const qs = await fetchCollection('questions', [['examId','==',examId]]);
    const totalMarks = qs.reduce((s,q)=>s+q.marks,0);
    await updateDoc(doc(db, 'exams', examId), { totalMarks });
    render();
  } catch (err) { showAlert('Error deleting question: ' + err.message, 'error'); }
  finally { hideLoader(); }
}

/* =========================================================================
   SECTION 8: GUEST EXAM-TAKING FLOW (no account, just name + class)
========================================================================= */
function beginExam(examId, name, studentClass){
  if (!name || !name.trim()) { showAlert('Please enter your full name.', 'error'); return; }
  if (!studentClass) { showAlert('Please select your class.', 'error'); return; }
  if (localStorage.getItem('cbt_done_' + examId)) { showAlert('This exam was already completed on this device.', 'error'); return; }
  selectedAnswers = {};
  localStorage.setItem('cbt_start_' + examId, Date.now().toString());
  navigateTo('exam', { examId, studentName: name.trim(), studentClass });
}

function selectAnswer(questionId, optionIndex){
  selectedAnswers[questionId] = optionIndex;
  render();
}

async function submitExam(examId, auto=false){
  if (examTimerInterval) clearInterval(examTimerInterval);
  showLoader();
  try {
    await ensureAnonAuth();
    const questions = await fetchCollection('questions', [['examId','==',examId]]);
    const examSnap = await getDoc(doc(db, 'exams', examId));
    const exam = { id: examId, ...examSnap.data() };
    let score = 0;
    questions.forEach(q => { if (selectedAnswers[q.id] === q.correctIndex) score += q.marks; });
    const percentage = exam.totalMarks > 0 ? Math.round((score / exam.totalMarks) * 100) : 0;
    const passed = percentage >= exam.passMark;
    await addDoc(collection(db, 'attempts'), {
      examId, studentName: pageParams.studentName, studentClass: pageParams.studentClass,
      score, totalMarks: exam.totalMarks, percentage, passed,
      answers: selectedAnswers, submittedAt: serverTimestamp()
    });
    localStorage.setItem('cbt_done_' + examId, '1');
    localStorage.removeItem('cbt_start_' + examId);
    navigateTo('exam-done', { title: exam.title, score, totalMarks: exam.totalMarks, percentage, passed });
  } catch (err) { showAlert('Error submitting exam: ' + err.message, 'error'); }
  finally { hideLoader(); }
}

/* =========================================================================
   SECTION 9: EXPORTS — Word (.doc), PDF, and copy-to-clipboard
========================================================================= */
function exportToWord(title, headers, rows, filename){
  let tableRows = '<tr>' + headers.map(h => `<th style="border:1px solid #764ba2;background:#f0eefc;padding:8px;">${h}</th>`).join('') + '</tr>';
  rows.forEach(r => {
    tableRows += '<tr>' + r.map(c => `<td style="border:1px solid #ccc;padding:8px;">${c}</td>`).join('') + '</tr>';
  });
  const html = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><title>${title}</title></head>
    <body>
      <h2 style="color:#4b3384;">${title}</h2>
      <p style="color:#666;">Generated on ${new Date().toLocaleString()}</p>
      <table style="border-collapse:collapse;width:100%;">${tableRows}</table>
    </body></html>`;
  const blob = new Blob(['\ufeff', html], { type:'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename.endsWith('.doc') ? filename : filename + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showAlert('Word document downloaded.', 'success');
}

function exportToPDF(title, headers, rows, filename){
  if (!window.jspdf) { showAlert('PDF library did not load — check your internet connection.', 'error'); return; }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();
  pdf.setFontSize(16);
  pdf.setTextColor(118, 75, 162);
  pdf.text(title, 14, 18);
  pdf.setFontSize(10);
  pdf.setTextColor(100);
  pdf.text('Generated on ' + new Date().toLocaleString(), 14, 25);
  if (typeof pdf.autoTable === 'function') {
    pdf.autoTable({ startY: 32, head: [headers], body: rows, headStyles: { fillColor: [118,75,162] }, styles: { fontSize: 9 } });
  } else {
    // Fallback if the autoTable plugin failed to load: plain text rows
    let y = 34;
    pdf.text(headers.join('   |   '), 14, y);
    rows.forEach(r => { y += 7; pdf.text(r.join('   |   '), 14, y); });
  }
  pdf.save(filename.endsWith('.pdf') ? filename : filename + '.pdf');
  showAlert('PDF downloaded.', 'success');
}

function copyResultsToClipboard(headers, rows){
  const text = [headers.join('\t'), ...rows.map(r => r.join('\t'))].join('\n');
  navigator.clipboard.writeText(text)
    .then(() => showAlert('Copied! Paste directly into Excel or Word.', 'success'))
    .catch(() => showAlert('Could not copy — your browser may not support this.', 'error'));
}

            <input type="radio" name="q_${q.id}" ${selectedAnswers[q.id]===idx?'checked':''} readonly>

          </div>`).join('')}
      </div>`).join('') || '<div class="card center muted">This exam has no questions yet.</div>'}

function setupExamTimer(examId, endTime){
  if (examTimerInterval) clearInterval(examTimerInterval);
  const display = document.getElementById('examTimerDisplay');
  if (!display) return;
  function tick(){
    const remaining = endTime - Date.now();
    const el = document.getElementById('examTimerDisplay');
    if (!el) { clearInterval(examTimerInterval); return; }
    if (remaining <= 0) {
      el.textContent = '00:00';
      clearInterval(examTimerInterval);
      submitExam(examId, true);
      return;
    }
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    el.textContent = String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
  }
  tick();
  examTimerInterval = setInterval(tick, 1000);
}

async function render(){
  renderNav();
  const app = document.getElementById('app');
  showLoader();
  try {
    let html = '';
    if (currentPage === 'home') {
      html = renderHome();
    } else if (currentPage === 'browse-exams') {
      await ensureAnonAuth();
      const exams = await fetchCollection('exams', [['status','==','published']]);
      html = renderExamsBrowse(exams);
    } else if (currentPage === 'exam-intro') {
      await ensureAnonAuth();
      const examSnap = await getDoc(doc(db, 'exams', pageParams.examId));
      const exam = examSnap.exists() ? { id: pageParams.examId, ...examSnap.data() } : null;
      html = renderExamIntro(exam);
    } else if (currentPage === 'exam') {
      await ensureAnonAuth();
      const examSnap = await getDoc(doc(db, 'exams', pageParams.examId));
      const exam = examSnap.exists() ? { id: pageParams.examId, ...examSnap.data() } : null;
      const questions = exam ? await fetchCollection('questions', [['examId','==',exam.id]]) : [];
      html = renderExam({ exam, questions });
    } else if (currentPage === 'exam-done') {
      html = renderExamDone(pageParams);
    } else if (!currentUser) {
      if (currentPage === 'login') html = renderLogin();
      else if (currentPage === 'register') html = renderRegister();
      else html = renderHome();
    } else if (currentUser.role === 'admin' && currentPage === 'admin') {
      const [users, exams, attempts] = await Promise.all([
        fetchCollection('users'), fetchCollection('exams'), fetchCollection('attempts')
      ]);
      html = renderAdmin({ users, exams, attempts });
    } else if (currentUser.role === 'teacher' && currentPage === 'teacher') {
      const myExams = await fetchCollection('exams', [['teacherId','==',currentUser.id]]);
      const questionCounts = {};
      for (const e of myExams) {
        const qs = await fetchCollection('questions', [['examId','==',e.id]]);
        questionCounts[e.id] = qs.length;
      }
      html = renderTeacher({ myExams, questionCounts });
    } else if (currentPage === 'questions') {
      const examSnap = await getDoc(doc(db, 'exams', pageParams.examId));
      const exam = examSnap.exists() ? { id: pageParams.examId, ...examSnap.data() } : null;
      const questions = exam ? await fetchCollection('questions', [['examId','==',exam.id]]) : [];
      html = renderQuestions({ exam, questions });
    } else if (currentPage === 'results') {
      const examSnap = await getDoc(doc(db, 'exams', pageParams.examId));
      const exam = examSnap.exists() ? { id: pageParams.examId, ...examSnap.data() } : null;
      const attempts = exam ? await fetchCollection('attempts', [['examId','==',exam.id]]) : [];
      html = renderResults({ exam, attempts });
    } else {
      html = currentUser.role === 'admin' ? renderAdmin({users:[],exams:[],attempts:[]}) : renderTeacher({myExams:[],questionCounts:{}});
    }
    app.innerHTML = html;
    wireEvents();
  } catch (err) {
    showAlert('Error loading page: ' + err.message, 'error');
  } finally {
    hideLoader();
  }
}

function wireEvents(){
  const loginBtn = document.getElementById('loginBtn');
  if (loginBtn) loginBtn.onclick = () => loginUser(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);

  const setupAdminBtn = document.getElementById('setupAdminBtn');
  if (setupAdminBtn) setupAdminBtn.onclick = setupDefaultAdmin;

  const registerBtn = document.getElementById('registerBtn');
  if (registerBtn) registerBtn.onclick = () => registerTeacher(
    document.getElementById('regName').value, document.getElementById('regEmail').value, document.getElementById('regPassword').value);

  const beginExamBtn = document.getElementById('beginExamBtn');
  if (beginExamBtn) beginExamBtn.onclick = () => beginExam(
    pageParams.examId, document.getElementById('introName').value, document.getElementById('introClass').value);

  const createExamBtn = document.getElementById('createExamBtn');
  if (createExamBtn) createExamBtn.onclick = () => createExam(
    document.getElementById('examTitle').value, document.getElementById('examSubject').value,
    document.getElementById('examDuration').value, document.getElementById('examPassMark').value);

  const addQuestionBtn = document.getElementById('addQuestionBtn');
  if (addQuestionBtn) addQuestionBtn.onclick = () => addQuestion(
    pageParams.examId, document.getElementById('qText').value, document.getElementById('qMarks').value,
    [document.getElementById('qOptA').value, document.getElementById('qOptB').value, document.getElementById('qOptC').value, document.getElementById('qOptD').value],
    document.getElementById('qCorrect').value);

  const submitExamBtn = document.getElementById('submitExamBtn');
  if (submitExamBtn) submitExamBtn.onclick = () => {
    if (confirm('Submit your exam now? You cannot change answers after submitting.')) submitExam(pageParams.examId, false);
  };

  const downloadUsersBtn = document.getElementById('downloadUsersBtn');
  if (downloadUsersBtn) downloadUsersBtn.onclick = () => exportToWord(
    'All Users Report', ['Name','Email','Role'],
    (window.__adminUsers||[]).map(u => [u.name, u.email, u.role]), 'users-report');

  const downloadResultsWordBtn = document.getElementById('downloadResultsWordBtn');
  if (downloadResultsWordBtn) downloadResultsWordBtn.onclick = () => {
    const exam = window.__resultsExam;
    exportToWord('Results — ' + exam.title, ['Name','Class','Score','Percentage','Status'], window.__resultsRows||[], 'results-' + exam.title.replace(/\s+/g,'-'));
  };
  const downloadResultsPdfBtn = document.getElementById('downloadResultsPdfBtn');
  if (downloadResultsPdfBtn) downloadResultsPdfBtn.onclick = () => {
    const exam = window.__resultsExam;
    exportToPDF('Results — ' + exam.title, ['Name','Class','Score','Percentage','Status'], window.__resultsRows||[], 'results-' + exam.title.replace(/\s+/g,'-'));
  };
  const copyResultsBtn = document.getElementById('copyResultsBtn');
  if (copyResultsBtn) copyResultsBtn.onclick = () => copyResultsToClipboard(['Name','Class','Score','Percentage','Status'], window.__resultsRows||[]);

  window.__deleteExam = deleteExam;
  window.__deleteQuestion = deleteQuestion;
  window.__selectAnswer = selectAnswer;
}

/* =========================================================================
   SECTION 12: INITIAL RENDER
========================================================================= */
render();
</script>
</body>
</html>
